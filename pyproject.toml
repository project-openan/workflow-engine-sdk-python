[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2at-engine"
version = "0.4.0"
description = "Standalone workflow execution SDK for A2A-T multi-agent orchestration"
readme = "README_en.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk>=1.0.0",
    "a2a-t-sdk>=1.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "protobuf>=4.25.0",
    "packaging>=23.0",
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/project-openan/workflow-exec-engine"

[tool.setuptools.packages.find]
include = ["a2at_engine*"]
